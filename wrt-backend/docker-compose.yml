version: '3.8'

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: wrt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wrt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wrt_secret}
      POSTGRES_DB: ${POSTGRES_DB:-wrt_garage}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wrt_user} -d ${POSTGRES_DB:-wrt_garage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- WRT Backend API ----
  wrt-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wrt-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wrt_user}:${POSTGRES_PASSWORD:-wrt_secret}@postgres:5432/${POSTGRES_DB:-wrt_garage}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-google/gemini-2.5-flash}
      API_KEY_SECRET: ${API_KEY_SECRET:-change-me-in-production}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-30}
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
