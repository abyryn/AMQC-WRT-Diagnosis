; ============================================
; WRT Garage — Honda ECU Connectivity Tester
; PlatformIO Configuration
; ============================================

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Serial Monitor
monitor_speed = 115200
upload_speed = 921600
monitor_filters = 
    esp32_exception_decoder
    time

; Compiler flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3

